  <body>
    <div id="app"></div>
    <script>
      (() => {
        const postToPlayer = (command) => {
          document.querySelectorAll('iframe[src*="youtube.com/embed"]').forEach((frame) => {
            frame.contentWindow?.postMessage(JSON.stringify({
              event: 'command', func: command, args: []
            }), '*');
          });
        };

        const startMusic = () => postToPlayer('playVideo');
        const pauseMusic = () => postToPlayer('pauseVideo');

        // The embed itself has autoplay enabled. This retry covers slow loads.
        window.addEventListener('load', () => {
          startMusic();
          window.setTimeout(startMusic, 1200);
        }, { once: true });

        // Stop playback as the reader leaves the site, including mobile browsers.
        window.addEventListener('pagehide', pauseMusic);
        window.addEventListener('beforeunload', pauseMusic);
      })();
    </script>
